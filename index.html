<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Legenda do Sistema</title>
    <style>
        body { background: black; color: yellow; font-family: Arial; text-align: center; padding-top: 50px; }
        button { padding: 15px; font-size: 1.2rem; cursor: pointer; }
        #legenda { font-size: 2rem; margin-top: 30px; font-weight: bold; }
    </style>
</head>
<body>
    <button onclick="capturarAudioSistema()">Ouvir Som da Reunião</button>
    <div id="legenda">Aguardando...</div>

    <script>
        async function capturarAudioSistema() {
            try {
                // Este comando força o navegador a pedir o áudio do computador e ignora o microfone físico
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true, // O navegador exige pedir o vídeo junto para liberar o áudio do sistema
                    audio: true
                });

                document.getElementById('legenda').innerText = "[Áudio do computador conectado com sucesso!]";

                // O áudio da reunião agora está salvo dentro da variável 'stream'.
                
                /*
                  A BARREIRA TÉCNICA:
                  A ferramenta gratuita de reconhecimento de voz do navegador (webkitSpeechRecognition) 
                  NÃO aceita receber a variável 'stream'. O Google bloqueou essa função por segurança, 
                  obrigando a API a escutar EXCLUSIVAMENTE o hardware do microfone. 
                */

            } catch (err) {
                document.getElementById('legenda').innerText = "Você não autorizou ou ocorreu um erro.";
            }
        }
    </script>
</body>
</html>
