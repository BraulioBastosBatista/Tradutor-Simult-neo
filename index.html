<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Legenda com Áudio do Sistema</title>
    <style>
        body { background: black; color: yellow; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        button { padding: 15px; font-size: 1.2rem; cursor: pointer; margin-bottom: 20px; }
        #legenda { font-size: 2.5rem; font-weight: bold; width: 80%; margin: 0 auto; }
    </style>
</head>
<body>
    <button onclick="iniciarCaptura()">Ouvir Som da Reunião</button>
    <div id="legenda">Aguardando...</div>

    <script>
        // Chave da API inserida conforme solicitado
        const DEEPGRAM_API_KEY = '53ef75eeb72768bdaa5560d63dfe21445c612f86'; 
        let socket;

        async function iniciarCaptura() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true, 
                    audio: true
                });

                document.getElementById('legenda').innerText = "[Áudio capturado. Conectando à IA...]";

                // Inicia a conexão WebSocket com a IA
                socket = new WebSocket('wss://api.deepgram.com/v1/listen?model=nova-2&language=en', [
                    'token', DEEPGRAM_API_KEY
                ]);

                socket.onopen = () => {
                    document.getElementById('legenda').innerText = "[Conectado! Escutando a reunião...]";
                    
                    // Empacota o áudio capturado da aba
                    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    
                    mediaRecorder.addEventListener('dataavailable', event => {
                        if (event.data.size > 0 && socket.readyState === 1) {
                            socket.send(event.data);
                        }
                    });
                    
                    mediaRecorder.start(250); // Envia pacotes a cada 250ms
                };

                socket.onmessage = async (message) => {
                    const data = JSON.parse(message.data);
                    const transcricao = data.channel.alternatives[0].transcript;
                    
                    // Só aciona o tradutor se houver uma frase consolidada
                    if (transcricao && data.is_final) {
                        traduzir(transcricao);
                    }
                };

            } catch (err) {
                document.getElementById('legenda').innerText = "Erro ao capturar áudio da tela.";
                console.error(err);
            }
        }

        async function traduzir(texto) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt-br&dt=t&q=${encodeURIComponent(texto)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('legenda').innerText = data[0][0][0];
            } catch (error) {
                console.error("Erro na tradução", error);
            }
        }
    </script>
</body>
</html>
